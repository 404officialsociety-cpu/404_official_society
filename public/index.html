<meta name="description" content="Contemporary essentials for those who define their own style.">

<style>
:root{--bg:#f4f3f0;--fg:#111;--mut:#6b6b68;--card:#e6e4df;--line:#d4d2cc;--ink:#111;--inv:#f4f3f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--fg:#f1f0ec;--mut:#9a9a95;--card:#1c1c1c;--line:#2e2e2e;--ink:#f1f0ec;--inv:#0e0e0e}}
:root[data-theme="dark"]{--bg:#0e0e0e;--fg:#f1f0ec;--mut:#9a9a95;--card:#1c1c1c;--line:#2e2e2e;--ink:#f1f0ec;--inv:#0e0e0e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Space Grotesk',system-ui,sans-serif;margin:0;letter-spacing:-.03em;line-height:1}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;justify-content:space-between;padding:14px 5vw;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:20px}nav{display:flex;gap:22px;font-size:14px}nav a,nav button{background:none;border:0;color:var(--fg);padding:4px 0}
nav a:hover,nav button:hover{color:var(--mut)}
main{min-height:70vh}section{padding:72px 5vw}
.hero{padding:12vh 5vw 8vh}.hero h1{font-size:clamp(52px,14vw,190px);font-weight:700;text-transform:uppercase}
.hero p{max-width:34ch;font-size:20px;color:var(--mut);margin:28px 0}
.btn{display:inline-block;padding:14px 26px;border:1px solid var(--ink);background:var(--ink);color:var(--inv);font-weight:500;margin:0 10px 10px 0;transition:.2s}
.btn.o{background:none;color:var(--fg)}.btn:hover{opacity:.75}
.hd{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.hd h2{font-size:clamp(28px,5vw,48px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 16px}
.pimg{aspect-ratio:4/5;background:var(--card);display:grid;place-items:center;font:700 40px 'Space Grotesk';color:var(--mut);overflow:hidden;transition:.4s}
.card:hover .pimg{filter:brightness(.92)}.card h3{font-size:16px;margin-top:12px;font-weight:500}.card small{color:var(--mut)}
s{color:var(--mut);margin-left:6px}
.col{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.col a{background:var(--card);min-height:260px;padding:22px;display:flex;align-items:end;font:700 30px 'Space Grotesk';letter-spacing:-.03em;transition:.3s}.col a:hover{background:var(--ink);color:var(--inv)}
.dark{background:var(--ink);color:var(--inv)}.dark p{max-width:48ch;font-size:19px;opacity:.8}
.pd{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px}.pd .pimg{font-size:90px}
.sz{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}.sz button{min-width:48px;padding:10px;border:1px solid var(--line);background:none;color:var(--fg)}
.sz button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}.sz button[aria-pressed=true]{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);gap:12px}
.qty button{width:32px;height:32px;border:1px solid var(--line);background:none;color:var(--fg)}
input{width:100%;max-width:420px;padding:14px;border:1px solid var(--line);background:none;color:var(--fg);font:inherit;margin:6px 0 14px}
label{display:block;font-size:14px;color:var(--mut)}
.note{border-left:3px solid var(--fg);padding:8px 14px;background:var(--card);max-width:60ch;font-size:14px;margin:18px 0}
footer{padding:56px 5vw 40px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:32px 64px;font-size:14px;color:var(--mut)}
footer div{display:flex;flex-direction:column;gap:6px}footer b{color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--inv);padding:12px 20px;opacity:0;transition:.3s;pointer-events:none;z-index:20}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){nav{gap:14px}nav .hide{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
